name: CI

# Solo pruebas: tipos, la suite SQL offline y consistencia de diseño.
# No construye la app ni toca EAS/Supabase en producción.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos (TypeScript)
        run: npx tsc --noEmit -p .

      - name: Consistencia de diseño (colores/tipografía)
        run: npm run design:check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supabase/tests/offline/package-lock.json

      - name: Instalar dependencias de la suite offline
        working-directory: supabase/tests/offline
        run: npm ci

      - name: Suite SQL offline (RLS y funciones contra Postgres embebido)
        working-directory: supabase/tests/offline
        run: node tests.mjs
